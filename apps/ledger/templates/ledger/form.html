{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header"><h1>{{ title }}</h1></div>
<div class="card">
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <div><button class="btn" type="submit">Save</button></div>
  </form>
</div>
{% endblock %}
