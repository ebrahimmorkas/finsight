{% extends "base.html" %}

{% block title %}Transactions{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Transactions</h1>
  <div>
    <a class="btn btn--ghost" href="{% url 'imports:upload' %}">Import CSV</a>
    <a class="btn" href="{% url 'ledger:transaction-create' %}">Add transaction</a>
  </div>
</div>
<div class="layout">
  <aside class="sidebar card">
    <form method="get" class="form"
          hx-get="{% url 'ledger:transactions' %}" hx-target="#results" hx-swap="outerHTML" hx-push-url="true"
          hx-trigger="change, keyup changed delay:400ms from:input[type=text]">
      {{ filter.form.as_div }}
      <noscript><button class="btn" type="submit">Filter</button></noscript>
      <a class="muted" href="{% url 'ledger:transactions' %}">Clear</a>
    </form>
  </aside>
  <section>{% include "ledger/_transaction_table.html" %}</section>
</div>
{% endblock %}
